name: Demo on GitHub Pages

# Publishes the static demo (frontend/dist-demo/, every snapshot of eval/demo/)
# to GitHub Pages. Manual only: publishing is the owner's call, never a side
# effect of a merge. One-time setup: Settings → Pages → Source: GitHub Actions.
# Then Actions → "Demo on GitHub Pages" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build the static demo
        working-directory: frontend
        run: npm run build:demo
      - name: Refuse a demo with no snapshot
        run: |
          ls frontend/dist-demo/data/*.json > /dev/null 2>&1 || {
            echo "eval/demo/ holds no snapshot: nothing to publish (see eval/demo/README.md)"
            exit 1
          }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
