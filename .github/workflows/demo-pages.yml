name: Demo on GitHub Pages

# Publishes the static demo (frontend/dist-demo/, every snapshot of eval/demo/)
# to GitHub Pages. Manual only: publishing is the owner's call, never a side
# effect of a merge. One-time setup: Settings → Pages → Source: GitHub Actions.
# Then Actions → "Demo on GitHub Pages" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build the static demo
        working-directory: frontend
        run: npm run build:demo
      - name: Refuse a demo with no snapshot
        run: |
          ls frontend/dist-demo/data/*.json > /dev/null 2>&1 || {
            echo "eval/demo/ holds no snapshot: nothing to publish (see eval/demo/README.md)"
            exit 1
          }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
